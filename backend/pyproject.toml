# The backend: the FastAPI app (app/, from phase 1) and the recognition engine (engine/).
# An application, not a library: `engine` and `app` are imported from this directory.
#
#   uv sync                 light install: mock backends on CPU (demo, tests, the web app)
#   uv sync --extra ml      + torch, RF-DETR, SAM2, SigLIP2, EasyOCR for the real pipeline
#
# Python is capped below 3.13: torch, sam2 and faiss-cpu are the constraint.
[project]
name = "stocktaking-backend"
version = "0.2.0"
description = "Stocktaking AI: product recognition at the checkout counter, and the POS web API"
requires-python = ">=3.11,<3.13"

dependencies = [
    "numpy>=1.26,<3.0",
    "opencv-python-headless>=4.9",
    "PyYAML>=6.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlmodel>=0.0.22",
    "Pillow>=10.0",
    "matplotlib>=3.8",
    "pandas>=2.2",
    "faiss-cpu==1.15.0",
    # needs the zbar shared library: apt libzbar0, brew zbar
    "pyzbar>=0.1.9",
    # the web API (app/)
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    # the engine reads its catalog through a synchronous connection
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pyjwt>=2.9",
]

[project.optional-dependencies]
# The real neural backends. Every one of them is imported lazily by the engine, so the
# light install runs the mock backends (configs/config.demo.yaml) without them.
ml = [
    "torch>=2.4",
    "torchvision>=0.19",
    "rfdetr==1.9.4",
    "supervision==0.30.1",
    "transformers==5.16.1",
    "sam2==1.1.0",
    "easyocr==1.7.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.9",
    "mypy>=1.13",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["notebooks", "data", "data_demo", "weights"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

# Type-checked: the web app only. The engine predates the type gate and is checked by its tests.
[tool.mypy]
python_version = "3.12"
files = ["app", "entrypoints", "migrations"]
strict = true

[[tool.mypy.overrides]]
module = ["engine", "engine.*"]
follow_imports = "skip"
ignore_errors = true
