# =============================================================================
# STOCKTAKING AI - CENTRAL CONFIGURATION
# Version: 0.1.0
# Single source of truth for runtime parameters across the pipeline.
# =============================================================================

# --- Application ---
app:
  name: "Stocktaking AI"
  version: "0.1.0"
  environment: "development" # development | production
  device: "cuda" # cpu | cuda

# --- Logging ---
logging:
  level: "INFO" # DEBUG | INFO | WARNING | ERROR
  log_dir: "data/cache/logs"
  log_to_file: true
  log_to_console: true
  max_bytes: 5242880
  backup_count: 3

# --- Paths ---
paths:
  gallery_dir: "data/gallery"
  benchmark_dir: "data/benchmark"
  benchmark_images_dir: "data/benchmark/images"
  benchmark_labels_dir: "data/benchmark/_annotations.coco.json"
  query_dir: "data/query"
  output_dir: "data/outputs"
  cache_dir: "data/cache"
  metadata_dir: "data/metadata"
  detector_weights_dir: "weights/detector"
  retriever_weights_dir: "weights/retriever"
  plugin_weights_dir: "weights/plugins"
  refinement_weights_dir: "weights/refinement"

# --- Product Catalog / Metadata ---
catalog:
  # Nguồn catalog cho pipeline: sqlite (DB, mặc định) | snapshot (Colab)
  source: "sqlite"
  db_path: "data/db/app.db"

# --- Detection Module ---
detection:
  backend: "rf_detr" # mock_contour | rf_detr
  weights_path: "weights/detector/model.pt"
  # Đo 2026-10-06 trên val (sau lọc khung trùng): 0,50 sót 13 / thừa 10; 0,40 sót 10 / thừa 13;
  # 0,30 sót 6 / thừa 17. Chốt 0,40: bỏ sót là lỗi đắt nhất; dưới 0,40 dòng thừa tăng nhanh.
  confidence_threshold: 0.40
  min_box_area_ratio: 0.001
  max_box_area_ratio: 0.60
  min_aspect_ratio: 0.15
  max_aspect_ratio: 6.0
  canny_threshold_1: 40
  canny_threshold_2: 120
  blur_kernel_size: 5
  max_detections: 50
  # Lọc khung thừa sau detect (RF-DETR không tự lọc): một vật ra hai khung là bị tính tiền hai lần.
  suppression:
    enabled: true
    # Hai khung có IoU >= ngưỡng là cùng một vật: bỏ khung tin cậy thấp hơn. Đo 2026-10-06 trên
    # val: bỏ 4 khung, không vật nào mất khung, precision 0,898 -> 0,910.
    duplicate_iou: 0.6
    # Bỏ khung chứa >= N khung khác (khung quanh cả túi/cụm hàng). 0 = tắt. ĐANG TẮT: trên val nó
    # bỏ 2 khung cụm nhưng cũng bỏ khung của một sản phẩm thật bị hai vật khác đè lên.
    container_min_boxes: 0
    containment_ratio: 0.8
  rf_detr:
    variant: "base" # nano | small | medium | base | large
    weights_path: "weights/detector/checkpoint_best_ema.pth"
    device: "cuda"
    inference:
      optimize: true
      compile: false
      batch_size: 1
      dtype: "float32" # float32 | float16
      inplace: false

# --- Detection Refinement / Segmentation ---
refinement:
  enabled: true
  backend: "sam2" # none | sam2
  trigger:
    enabled: true
    iou_threshold: 0.05
    overlap_ratio_threshold: 0.20
    min_overlapping_pairs: 1
    require_multiple_detections: true
  sam2:
    model_type: "sam2.1_hiera_small"
    checkpoint_path: "weights/refinement/sam2/sam2.1_hiera_small.pt"
    model_config: ""
    device: "cuda"
    prompt_type: "box"
    use_source_image: true
    per_detection: true
    mask_threshold: 0.50
    min_mask_area_ratio: 0.03
  output:
    use_mask_bbox: true
    fallback_to_detection_bbox: true
    min_mask_coverage_ratio: 0.55
    max_bbox_expansion_ratio: 1.50
    min_refinement_iou: 0.50

# --- Cropping Module ---
cropping:
  padding_pixels: 4
  target_size: [1024, 1024]
  use_refined_bbox: true

# --- Retrieval Module ---
retrieval:
  backend: "siglip2" # mock_visual_embedding | siglip2
  embedding_dim: 768
  gallery_index_path: "data/cache/gallery_index.faiss"
  gallery_metadata_path: "data/cache/gallery_metadata.json"
  top_k: 5
  color_hist_bins: 8
  build_gallery_index: false
  siglip2:
    model_name: "google/siglip2-base-patch16-224"
    weights_path: "weights/retriever/siglip2"
    device: "cuda"
  augment: # thêm vector cho bản biến đổi của ảnh gallery lúc lập index (tắt = như cũ)
    enabled: false
    rotations: [90, 180, 270]
    center_crops: [] # tỉ lệ cạnh giữ lại khi cắt giữa ảnh, vd [0.8]
    max_images: 0 # chỉ augment SKU có <= N ảnh gốc; 0 = mọi SKU

# --- Decision Engine ---
decision:
  similarity_threshold: 0.55
  min_confidence_accept: 0.60
  uncertain_band: 0.15
  detection_weight: 0.35
  similarity_weight: 0.65
  ambiguous_top_n: 3
  ambiguous_margin: 0.05

# --- Plugins ---
plugins:
  enabled: true
  ocr:
    enabled: true
    language:
      - en
    device: "cuda"
    min_text_length: 3
    confidence_threshold: 0.10
    upscale_enabled: true
    upscale_max: 3
    upscale_threshold_small: 300
    upscale_threshold_medium: 600
    clahe_enabled: true
    clahe_clip_limit: 2.0
    clahe_tile_grid_size: 8
    rotation_enabled: true
    rotation_angles:
      - 90
      - 180
      - 270
    # Cạnh dài tối đa của ảnh vào bước PHÁT HIỆN chữ (nhận dạng vẫn đọc ảnh gốc). Mặc định của
    # EasyOCR là 2560. Đo 2026-10-06 trên val: 1600 giữ nguyên F1/fusion; 1280 làm tệ cặp SKU 7/8.
    detect_canvas_size: 1600
    # true: phát hiện chữ 2 lần (hướng 0 và 90), hướng 180/270 dùng lại hộp đã xoay 180 độ; vẫn
    # nhận dạng và chấm điểm đủ 4 hướng. false: cách cũ, phát hiện lại ở cả 4 hướng.
    # Đo 2026-10-06 trên val: F1 0,8927 -> 0,8995, không crop nào sai thêm, OCR nhanh gần gấp đôi.
    shared_detection: true
  color:
    enabled: true
    # "signature": so phân bố màu của cả crop với chữ ký màu học từ ảnh gallery (không ROI theo sản
    # phẩm, không màu gõ tay). "roi": cách cũ (màu trội của một vùng, so với bảng color_reference).
    # Đo 2026-10-06 trên val: "signature" sửa cả 4 ca SKU 6 -> 5, không làm sai ca nào
    # (F1 0,9066 -> 0,9202). Cần file chữ ký: python scripts/build_color_signatures.py
    # (chạy lại mỗi khi thêm/đổi ảnh gallery).
    mode: "signature"
    signatures_path: "data/cache/color_signatures.npz"
    # Crop có ít hơn tỉ lệ này điểm ảnh có màu (hộp trắng ~0,01) thì màu không lên tiếng.
    min_colored_fraction: 0.05
    roi_enabled: true
    clustering_size: 96
    blur_kernel_size: 3
    canny_threshold1: 30
    canny_threshold2: 100
    morphology_enabled: true
    morphology_kernel_size: 5
    min_area_ratio: 0.45
    max_area_ratio: 0.75
    target_area_ratio: 0.60
    min_rectangularity: 0.80
    min_aspect_ratio: 0.70
    max_aspect_ratio: 2.50
    roi_shrink_ratio: 0.08
    fallback_center_roi: true
    fallback_roi_width_ratio: 0.70
    fallback_roi_height_ratio: 0.70
    use_lab: true
    remove_highlights: true
    highlight_l_threshold: 245
    min_dominant_chroma: 10.0
    highlight_l_secondary_threshold: 200
    highlight_chroma_threshold: 15.0
    center_weight_enabled: true
    center_weight_sigma_ratio: 0.6
    kmeans_l_weight: 0.9
    roi_detection_size: 256
    fallback_lower_width_ratio: 0.2
    fallback_lower_height_ratio: 0.2
    fallback_lower_x_ratio: 0.5
    fallback_lower_y_ratio: 0.5
    lower_position_target_y: 0.50
    lower_position_tolerance: 0.45
    n_clusters: 3
    kmeans_max_iter: 20
    kmeans_epsilon: 0.5
    kmeans_attempts: 3

  barcode:
    enabled: true

    # --- confidence computation ---
    quality_saturation: 30
    type_trust_default: 0.70
    type_trust:
      EAN13: 1.00
      EAN8: 1.00
      UPCA: 1.00
      UPCE: 1.00
      CODE128: 1.00
      CODE39: 0.60
      CODABAR: 0.60
      QRCODE: 0.90
    ambiguity_penalty: 0.50

    # --- presence pre-check (skip pipeline early when no barcode found) ---
    presence_check_enabled: true
    presence_edge_canny_threshold1: 50
    presence_edge_canny_threshold2: 150
    presence_edge_density_min: 0.01
    presence_sobel_ksize: 3
    presence_blur_kernel: 21
    presence_close_kernel_w: 21
    presence_close_kernel_h: 7
    presence_min_area_ratio: 0.02
    presence_roi_padding: 15

    # --- preprocessing pipeline (cumulative, early-exit on success) ---
    preprocessing_enabled: true

    deskew_enabled: true
    deskew_canny_threshold1: 50
    deskew_canny_threshold2: 150
    deskew_hough_threshold: 80
    deskew_max_angle: 45.0

    upscale_enabled: true
    upscale_threshold: 400
    upscale_max_factor: 3.0
    upscale_interpolation: "cubic"

    clahe_enabled: true
    clahe_clip_limit: 2.0
    clahe_tile_grid_size: 8

    adaptive_threshold_enabled: true
    adaptive_threshold_block_size: 11
    adaptive_threshold_c: 2

    denoise_enabled: true
    denoise_strength: 10.0

    sharpen_enabled: true
    sharpen_blur_sigma: 3.0
    sharpen_amount: 1.5

    rotation_fallback_enabled: true
    rotation_fallback_angles:
      - 90
      - 180
      - 270


# --- Reranking / Evidence Fusion ---
rerank:
  retrieval_protection:
    enabled: true
    consensus_mode: "hybrid"  # "hybrid" | "count" | "weight"

    consensus_start: 0.10
    consensus_strong: 0.80

    hybrid_weights:
      count: 0.50
      weighted: 0.30
      margin: 0.20

    margin_consensus_start: 0.10
    margin_consensus_strong: 0.30

    boost_ratio_min: 0.20
    boost_ratio_max: 1.00

    color_strong_ratio: 0.20
    ocr_strong_ratio: 0.30
    barcode_strong_ratio: 1.00

    min_switch_margin: 0.05

  confusable_min_agreeing_plugins: 1

  barcode:
    weight: 1.00

  ocr:
    weight: 0.60
    min_text_length: 2
    fuzzy_threshold: 0.80

  color:
    enabled: true
    weight: 0.20
    delta_e_strong: 6.0
    delta_e_weak: 20.0
    min_margin: 1.0
    margin_scale: 5.0
    l_weight: 0.1
    # Chế độ "signature": SKU giống nhất phải hơn SKU thứ nhì quá mức này (độ giao biểu đồ, 0..1)
    # mới được cộng bằng chứng; bằng chứng đạt tối đa ở min_margin + margin_scale.
    signature_min_margin: 0.10
    signature_margin_scale: 0.20

# --- Storage ---
storage:
  save_json: true
  save_csv: true
  save_annotated_image: true
  json_filename: "result.json"
  csv_filename: "result.csv"
  annotated_image_filename: "result.jpg"
  box_color: [0, 200, 0]
  box_thickness: 6
  font_scale: 1.5

# --- Validation ---
validation:
  iou_match_threshold: 0.30
  top_k: 5
  confidence_threshold: 0.0
  report_json_filename: "report.json"
  report_csv_filename: "report.csv"
  summary_filename: "summary.txt"
  records_filename: "records.csv"
  chart_filename: "validation_summary_chart.png"
  annotated_images_dirname: "validation_images"
  export_records: true
  save_annotated_images: true
  stages:
    detection: true
    cropping: true
    overlap: true
    segmentation: true
    retrieval: true
    decision: true
    plugins: true
    fusion: true
    end_to_end: true
  metrics:
    detection: [precision, recall, f1, mean_iou]
    cropping: [valid_rate, mean_iou]
    overlap: [precision, recall, f1]
    segmentation: [iou_improvement, improved_rate]
    retrieval: [top1_accuracy, topk_accuracy, mrr, mean_rank, recall_at_k]
    decision: [accuracy, precision, recall, f1, confusion_matrix]
    plugins: [trigger_rate, success_rate, coverage_rate, accuracy, correction_rate, degradation_rate, influence_rate, latency]
    fusion: [accuracy_before, accuracy_after, improvement, correction_rate]
    end_to_end: [precision, recall, f1, confusion_matrix]