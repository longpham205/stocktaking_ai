# Serves the built SPA and forwards /api to the API (`api` service, :8000 in docker compose). The
# API has no CORS middleware: the browser reaches it same-origin, through this proxy.
server {
    listen 80;
    root /usr/share/nginx/html;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # a basket photo is the request body: above MAX_UPLOAD_MB (10) the API answers 413 itself
        client_max_body_size 12m;
        # applying engine settings rebuilds the pipeline (the API allows up to 15 minutes)
        proxy_read_timeout 16m;
    }

    # Every other path is a client route (TanStack Router), not a file.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
