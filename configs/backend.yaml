# Cấu hình web POS (backend). Mọi khoá đều tuỳ chọn: thiếu thì dùng mặc định trong backend/config.py.
# Bí mật (JWT_SECRET, mật khẩu seed) KHÔNG nằm ở đây: nằm trong .env (tự sinh ngẫu nhiên, không commit).
server:
  host: "0.0.0.0"            # 127.0.0.1 nếu chỉ dùng trên máy này
  port: 8000
  max_upload_mb: 10          # ảnh lớn hơn bị từ chối bằng thông báo rõ ràng (IMAGE_TOO_LARGE)
  allowed_origins: []        # mặc định cùng origin (backend tự phục vụ giao diện) nên không cần CORS

auth:
  token_ttl_minutes: 480
  max_failed_attempts: 5     # sai quá số lần này sẽ bị khoá tạm theo (tài khoản, IP)
  lockout_minutes: 5

inference:
  queue_max: 20              # hàng đợi đầy -> QUEUE_FULL
  timeout_seconds: 60        # hiện chỉ cảnh báo log (timeout cứng: việc làm sau)
  idempotency_window_seconds: 5

db:
  path: "data/db/app.db"     # ghi đè bằng --data-dir (ví dụ data_demo)
media:
  root: "data/transactions"  # ảnh chụp + ảnh crop của từng đơn
  url_ttl_seconds: 600       # URL ảnh có chữ ký, hết hạn sau ngần này giây
  retention_days: 30         # ảnh cũ hơn bị xoá lúc khởi động (bản ghi đơn hàng vẫn giữ)
  thumb_width: 240

pos:
  allow_checkout_without_price: false   # admin đổi được trong giao diện (Cài đặt)
  timezone_offset_hours: 7              # múi giờ để tính "hôm nay" trong báo cáo/lịch sử
